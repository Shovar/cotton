[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ros-studio"
version = "0.1.0"
description = "Local web control panel for an active ROS 2 environment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Toni" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.10",
  "build>=1.2",
]

[project.scripts]
ros-studio = "ros_studio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/ros_studio"]

[tool.hatch.build.targets.sdist]
include = [
  "backend/src/ros_studio",
  "backend/tests",
  "docs",
  "AGENTS.md",
  "LICENSE",
  "README.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:launch_testing -p no:launch_ros"
markers = ["integration: requires a real ROS 2 environment"]

[tool.coverage.run]
source = ["ros_studio"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ros_studio"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["rclpy.*", "rcl_interfaces.*", "rosidl_runtime_py.*", "yaml.*"]
ignore_missing_imports = true
